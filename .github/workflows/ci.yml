# CI do Maestro — fecha a dívida P2-12 e a exigência do ENGINEERING_SPEC §CI/CD
# ("shellcheck + bats + bun test + maestro doctor --ci + validação de schema").
#
# Duas divergências deliberadas em relação à letra do spec, ambas já registradas:
#   - bats  -> bash puro. Decisão 8 do docs/decision-log.md ("bats não está instalado
#     e a dependência não se paga"). A suíte é `tests/run-all.sh`, 700+ asserções.
#   - bun test -> não existe `*.test.ts` nem `package.json`; a CLI (`src/cli.ts`) é
#     exercitada de fora por `tests/cli/test-cli.sh`, que roda dentro do run-all.
#   - validação de schema dos YAML -> coberta por `maestro doctor`, que faz parse real
#     do routing-table.yaml via Bun.YAML e valida hooks.json/plugin.json.
#
# Nada aqui depende de rede em runtime do plugin; a rede é só do runner.
#
# Onde roda: a variável do repo VULCAN_RUNS_ON; vazia, o runner da lab (label `lab`, contêiner efêmero
# lab-maestro-N, imagem tropeks/vulcan:lab/runner/Dockerfile). O runner hospedado do GitHub parou por cobrança.
# A lab não tem shellcheck, sqlite3, xz, pipx nem python3-venv, e o job não usa sudo: cada ferramenta vem
# para o $RUNNER_TEMP do job em versão exata, com sha256 conferido por `sha256sum -c` antes de usar.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: a CI só lê o repo. Este repo é um roteador que protege
# `.github/workflows/` justamente porque é por onde se executa código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JQ_VERSAO: "1.7.1"
  JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Instala explicitamente em vez de presumir a imagem do runner. Sem apt nem sudo (a lab não dá sudo ao
      # job): binário fixado, sha256 conferido. A lab não tem `xz`, por isso o .tar.xz abre pelo lzma do python3.
      - name: Instalar shellcheck e jq
        env:
          SHELLCHECK_VERSAO: "0.10.0"
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ferramentas"; mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSAO/shellcheck-v$SHELLCHECK_VERSAO.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          python3 -c 'import sys, tarfile; tarfile.open(sys.argv[1]).extract(sys.argv[2], sys.argv[3], filter="data")' \
            "$RUNNER_TEMP/sc.tar.xz" "shellcheck-v$SHELLCHECK_VERSAO/shellcheck" "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSAO/shellcheck" "$bin/shellcheck"
          curl -fsSL -o "$bin/jq" "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSAO/jq-linux-amd64"
          echo "$JQ_SHA256  $bin/jq" | sha256sum -c -
          chmod 0755 "$bin/jq"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/shellcheck" --version
          "$bin/jq" --version

      # A lista é derivada do disco, não hardcoded: hook ou teste novo entra
      # na CI sem ninguém lembrar de editar este arquivo.
      - name: Montar a lista de alvos
        id: targets
        run: |
          set -euo pipefail
          {
            find hooks -type f -name '*.sh'
            find tests -type f -name '*.sh'
            printf 'bin/maestro\n'
          } | sort -u > /tmp/sh-targets.txt
          echo "Alvos ($(wc -l < /tmp/sh-targets.txt)):"
          cat /tmp/sh-targets.txt
          test -s /tmp/sh-targets.txt

      # GATE BLOQUEANTE: severidade `error`. Baseline em 2026-08-09 = 0 errors.
      # Warnings/info existem (relatório completo no passo seguinte) e estão
      # catalogados no relatório do Agente C; quando forem tratados, trocar
      # --severity=error por --severity=warning aqui e o gate aperta sozinho.
      - name: shellcheck (gate — severity=error)
        run: |
          set -euo pipefail
          xargs -a /tmp/sh-targets.txt \
            shellcheck -x -P SCRIPTDIR --severity=error --format=gcc

      # NÃO BLOQUEANTE: inventário completo, com anotação no PR e contagem no
      # summary. É o que impede a CI de virar decorativa enquanto o gate está em
      # `error` — a dívida fica visível a cada run em vez de sumir.
      - name: shellcheck (relatório completo — informativo)
        if: always()
        run: |
          set -uo pipefail
          xargs -a /tmp/sh-targets.txt \
            shellcheck -x -P SCRIPTDIR --severity=style --format=json1 > /tmp/sc.json || true
          for lvl in error warning info style; do
            n=$(jq --arg l "$lvl" '[.comments[] | select(.level==$l)] | length' /tmp/sc.json)
            printf '%s: %s\n' "$lvl" "$n"
            printf '%s: %s\n' "$lvl" "$n" >> "$GITHUB_STEP_SUMMARY"
          done
          jq -r '.comments[] | select(.level=="warning" or .level=="error")
                 | "::warning file=\(.file),line=\(.line),col=\(.column)::SC\(.code) \(.message)"' \
            /tmp/sc.json

  suite:
    # O nome do check é `testes`: é o portão do integrador (tropeks/vulcan integrador/trilhas.py). Não renomeie.
    name: testes
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # jq é contrato duro dos hooks (API_SPEC §1); flock vem do util-linux e é o
      # que impede perda de linha no log sob contenção (decision-log #7).
      # jq e sqlite3 (os testes do `baseline` e do `conform` montam o ponte.db de fixture com ele) vêm
      # para o job em versão exata e com sha256 conferido, sem apt nem sudo: a imagem do runner pode mudar,
      # o contrato não. O flock é do util-linux da imagem base e só se confere.
      - name: Instalar jq e sqlite3, conferir flock
        env:
          SQLITE_VERSAO: "3500400"
          SQLITE_ANO: "2025"
          SQLITE_SHA256: 2c61fe3f6bfcf4ab0cad6c4edf1fa1cae93bbb816b744bef52a4bdde5bf7bf38
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ferramentas"; mkdir -p "$bin"
          curl -fsSL -o "$bin/jq" "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSAO/jq-linux-amd64"
          echo "$JQ_SHA256  $bin/jq" | sha256sum -c -
          chmod 0755 "$bin/jq"
          curl -fsSL -o "$RUNNER_TEMP/sqlite.zip" "https://www.sqlite.org/$SQLITE_ANO/sqlite-tools-linux-x64-$SQLITE_VERSAO.zip"
          echo "$SQLITE_SHA256  $RUNNER_TEMP/sqlite.zip" | sha256sum -c -
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract("sqlite3", sys.argv[2])' "$RUNNER_TEMP/sqlite.zip" "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/sqlite3" "$bin/sqlite3"
          echo "$bin" >> "$GITHUB_PATH"
          command -v flock >/dev/null || { echo "flock ausente"; exit 1; }
          "$bin/jq" --version
          "$bin/sqlite3" --version
          flock --version

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          no-cache: true   # workflow também roda em tag v*: sem cache, sem envenenamento (zizmor cache-poisoning)

      - name: Conferir o ambiente
        run: |
          set -euo pipefail
          command -v bun >/dev/null || { echo "bun ausente"; exit 1; }
          bun --version
          bash --version | head -1
          # A CI nunca roda com o kill-switch ligado — seria uma suíte verde vazia.
          test -z "${MAESTRO_OFF:-}" || { echo "MAESTRO_OFF setado na CI"; exit 1; }

      # run-all.sh isola MAESTRO_HOME num mktemp -d próprio (review P2-8),
      # então não precisa de setup de estado nem de limpeza.
      - name: Suíte completa
        run: bash tests/run-all.sh

      # doctor --ci: sem cor, resumo de uma linha, exit code fiel.
      # Roda DEPOIS da suíte e sem MAESTRO_HOME custom, para exercitar o caminho
      # default (o run-all já cobre o caminho isolado).
      - name: maestro doctor --ci
        run: ./bin/maestro doctor --ci

      # Catraca anti-slop (E9/S-905) no PR: reprova SÓ smell que EXCEDER o
      # baseline versionado (.maestro-habits.tsv) — dívida igual passa, slop
      # novo não entra. Achado do Capitão em 2026-08-24: sem este passo, a
      # catraca valia só para quem edita com o plugin; PR externo (repo é
      # público) entrava sem régua. O passo do sensor É o padrão; o sweep
      # (/maestro:deslop) é só a quitação do estoque.
      - name: maestro habits (catraca vs baseline)
        run: ./bin/maestro habits --all --project "$PWD"

  # -------------------------------------------------------------------------
  # approve — a ÚNICA coisa que esta CI escreve no repositório (E23c/S-2303).
  #
  # Por que uma tag MÓVEL: `stable` não é uma release, é um PONTEIRO para "o
  # último commit que passou shellcheck + suíte numa tag v*". O auto-update das
  # máquinas segue esse ponteiro em vez do topo da `main` (que pode estar
  # vermelho por minutos ou horas) — ff-only até `stable` é, por construção,
  # "só o que já foi provado". Ponteiro anda; por isso `-f` aqui e fetch
  # forçado do outro lado (hooks/lib/update-check.sh).
  #
  # Por que é a única escrita: este repo é um roteador que protege
  # `.github/workflows/` justamente porque é por onde se executa código. O topo
  # do arquivo segue `contents: read`; a permissão de escrita existe SÓ neste
  # job, SÓ em `refs/tags/v*`, e SÓ depois dos dois gates passarem. Nada de
  # commit, nada de release, nada de push em branch.
  approve:
    name: aprovar (mover a tag stable)
    needs: [shellcheck, suite]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — a tag aponta para $GITHUB_SHA e o push precisa do
      # histórico completo; clone raso faria o remoto recusar o objeto.
      # O job empurra a tag `stable` com a credencial do checkout e não sobe artefato nenhum.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:  # zizmor: ignore[artipacked]
          fetch-depth: 0

      - name: mover stable para o commit verde
        run: |
          set -euo pipefail
          # tag LEVE de propósito: sem objeto de tag não há identidade de
          # committer para configurar, e `describe --match 'v*'` do doctor
          # continua ignorando este ponteiro.
          # Só um commit que está em main vira stable: uma tag v* num branch
          # qualquer não move o ponteiro que o parque inteiro segue.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA não está em main — stable não se move"; exit 1; }
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
          printf 'stable -> %s (%s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Portões do integrador (tropeks/vulcan integrador/trilhas.py): `testes` é o job
  # `suite` acima; os três abaixo têm o nome fixo. `diff-cover` não entra (trilhas.yml):
  # o Maestro é bash e a CLI em TS roda por fora da suíte, sem cobertura por linha.
  segredos:
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # O binário do gitleaks, fixado e com sha256 conferido (a gitleaks-action baixava sem conferir, pedia o token e
      # o upload do SARIF dela quebra na lab, vulcan#128). Mesmo desenho do personas#15.
      - name: gitleaks
        env:
          GITLEAKS_VERSAO: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSAO/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      # Só o diff. No PR o checkout é o merge de teste e HEAD^1 é a base; no push, before..sha, e sem before utilizável
      # (zerado, ausente, ou fora do clone) o histórico alcançável do sha, nunca só o último commit. Em tag v* não há
      # before: varre o alcançável. --diff-merges=first-parent: sem ela o git log -p omite o patch de commit de merge,
      # e um segredo posto só na resolução de um merge passaria.
      - name: segredos no diff
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            faixa="HEAD^1..HEAD"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then
            faixa="$DEPOIS"
          else
            faixa="$ANTES..$DEPOIS"
          fi
          gitleaks git --log-opts="--diff-merges=first-parent $faixa" --redact --exit-code 1 --no-banner .

  auditoria:
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # O Maestro não tem dependência de pacote (bash + bun sem package.json). Lockfile que aparecer reprova até
      # o repo ganhar o auditor da fábrica (tropeks/vulcan .github/actions/portoes/auditoria.py). Inline e não
      # copiado porque a catraca de hábitos (maestro habits --all) mede o repo inteiro.
      - name: nenhuma dependência de pacote
        run: |
          achados=$(git ls-files | grep -E '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|uv\.lock|poetry\.lock|requirements[^/]*\.txt)$' || true)
          if [ -n "$achados" ]; then echo "lockfile sem auditor neste repo: $achados" >&2; exit 1; fi
          echo "sem lockfile nem requirements: nada a auditar"

  zizmor:
    runs-on: ${{ fromJSON(vars.VULCAN_RUNS_ON || '["self-hosted","Linux","lab"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A lab não tem pipx nem python3-venv: o uv (binário fixado, sha256 conferido) traz o Python numa versão
      # exata e roda o zizmor pelo uvx. Python e cache no temp do job: nada fica no runner entre jobs.
      - name: uv
        env:
          UV_VERSAO: 0.9.5
          UV_SHA256: 2cf10babba653310606f8b49876cfb679928669e7ddaa1fb41fb00ce73e64f66
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.tgz" "https://github.com/astral-sh/uv/releases/download/$UV_VERSAO/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/uv-bin" && tar -xzf "$RUNNER_TEMP/uv.tgz" -C "$RUNNER_TEMP/uv-bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: zizmor nos workflows
        env:
          GH_TOKEN: ${{ github.token }}   # libera as auditorias online (action com CVE, commit impostor)
          UV_PYTHON: "3.12.12"
        run: |
          uvx --from 'zizmor==1.32.0' zizmor --format plain .github/workflows

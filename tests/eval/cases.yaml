# tests/eval/cases.yaml — matriz de avaliação de roteamento (S-402)
#
# 15 tarefas do portfólio real do Romulo (NetForge/Go, SmartQuotation/Python+Postgres,
# Agenda Studio/TS-React, Vitali/Python, Legatus + homelab PVE/VPS), escritas como ele
# escreve: pt-BR, do telefone, curtas e vagas, imperativo, acentuação irregular.
#
# `expected` é o rótulo humano — a resposta que o Romulo consideraria "não precisei
# corrigir". Ele é JULGAMENTO, não verdade derivada da tabela: está aqui declarado por
# extenso justamente para poder ser contestado caso a caso (ver docs/ROUTING_EVAL.md §
# "Ameaças à validade").
#
# Campos:
#   id            chave estável (usada no TSV de veredito e no prompt do juiz)
#   prompt        o enunciado, verbatim
#   project/stack contexto (NÃO é entregue ao juiz cego além do que o prompt já diz)
#   kind          categoria de cobertura da matriz
#   expected      {workflow, mode, agents} — agents: [] significa "nenhum agente do
#                 roster; o passo é uma skill (gstack-*) ou trabalho do contexto principal"
#   ambiguous     true quando duas rotas/heurísticas competem de verdade
#   competes      qual é o conflito (texto para o relatório de calibração)
#   rationale     por que o expected é esse

cases:
  - id: go-nil-worker
    prompt: "o worker do netforge ta estourando nil pointer no parse, arruma"
    project: NetForge
    stack: go
    kind: bug-trivial-1-arquivo
    expected: {workflow: fix, mode: direct, agents: [golang-pro]}
    ambiguous: false
    rationale: >
      Panic com local conhecido: investigate+implement+review cabem num arquivo.
      Go explícito → especialista (H5) ganha de dev-pleno. Direct por H1.

  - id: ts-login-quebrado
    prompt: "o login do agenda studio quebrou depois do deploy de ontem"
    project: Agenda Studio
    stack: ts
    kind: bug-trivial-1-arquivo
    expected: {workflow: fix, mode: direct, agents: [typescript-pro]}
    ambiguous: false
    rationale: >
      É o exemplo literal do PROJECT_BRIEF §1. "quebrou" é intent de fix ao pé da letra.
      Stack do Agenda Studio é TS/React → typescript-pro.

  - id: py-export-csv
    prompt: "preciso de export csv no smartquotation, o backend e a telinha"
    project: SmartQuotation
    stack: python+ts
    kind: feature-multi-arquivo
    expected: {workflow: feature, mode: multi, agents: [python-pro, typescript-pro]}
    ambiguous: false
    rationale: >
      Duas stacks no mesmo pedido = dois especialistas em paralelo → mode multi.
      Feature nova → gate plan antes de implementar.

  - id: go-endpoint-health
    prompt: "cria um endpoint de health no netforge com as metricas"
    project: NetForge
    stack: go
    kind: feature-media
    expected: {workflow: feature, mode: subagent, agents: [golang-pro]}
    ambiguous: false
    rationale: >
      Feature nova de uma stack só → um subagente especialista, com plano (H2).

  - id: py-refactor-auth
    prompt: "o vitali ta uma bagunca, todo service repete o mesmo codigo de auth, limpa isso"
    project: Vitali
    stack: python
    kind: refactor-amplo
    expected: {workflow: refactor, mode: multi, agents: [engenheiro, python-pro]}
    ambiguous: false
    rationale: >
      "bagunça"/"limpa" = refactor. Extrair auth de N services é decisão de desenho antes
      de código: engenheiro produz o plano (gate plan), python-pro executa.

  - id: audit-legatus
    prompt: "da uma olhada de seguranca no legatus antes de eu expor na vps"
    project: Legatus
    stack: python+infra
    kind: auditoria-seguranca
    expected: {workflow: audit, mode: direct, agents: []}
    ambiguous: false
    rationale: >
      workflows.audit.steps = [gstack-cso]: o passo é uma skill pesada, não um agente do
      roster (princípio de curadoria: ferramenta pesada vem do gstack).

  - id: ship-smartquotation
    prompt: "manda o smartquotation pra producao"
    project: SmartQuotation
    stack: python
    kind: ship
    expected: {workflow: ship, mode: direct, agents: []}
    ambiguous: false
    rationale: >
      workflows.ship.steps = [gstack-ship], gate: ship — pausa para aprovação humana.
      Nenhum agente do roster envolvido.

  - id: pg-query-lenta
    prompt: "a query do relatorio do smartquotation ta levando 40s, ve o que da pra fazer"
    project: SmartQuotation
    stack: postgres
    kind: performance-postgres
    expected: {workflow: fix, mode: subagent, agents: [postgres-pro]}
    ambiguous: true
    competes: >
      fix ("não funciona"?) × refactor ("melhorar")  × custom. Lentidão não é erro nem
      dívida estrutural; nenhum intent da tabela cobre performance.
    rationale: >
      É um defeito observável com critério objetivo (tempo de query) → fix. EXPLAIN
      ANALYZE + índice é trabalho de especialista, não de contexto principal → subagent.

  - id: pg-campo-cnpj
    prompt: "adiciona o campo cnpj na tabela de cliente e faz a migration"
    project: SmartQuotation
    stack: postgres
    kind: feature-pequena-schema
    expected: {workflow: feature, mode: direct, agents: [postgres-pro]}
    ambiguous: true
    competes: >
      H1 ("edição ≤2 arquivos sem plano → direct") × H2 ("feature nova → subagente com
      plano"). A tabela não diz qual vence quando a feature é minúscula.
    rationale: >
      Uma coluna + uma migration = 2 arquivos. Exigir plano e subagente aqui é o tipo de
      cerimônia que faz o Romulo desligar a ferramenta (brief §9: 0-1 comandos por sessão).

  - id: infra-pve-restart
    prompt: "o container do postgres no pve ta reiniciando sozinho, ve isso"
    project: homelab (PVE)
    stack: infra
    kind: infra-diagnostico
    expected: {workflow: fix, mode: direct, agents: []}
    ambiguous: true
    competes: >
      fix × custom. É diagnóstico de infra: pode nem haver edição de código, e
      workflows.fix pressupõe implement+review. O roster não tem agente de infra/SRE.
    rationale: >
      "reiniciando sozinho" é defeito → fix. Sem agente de infra no roster (ADR-004 cobre
      só linguagens), a investigação fica no contexto principal → direct, agents [].

  - id: resumo-semana
    prompt: "escreve um resumo do que a gente fez essa semana pra eu mandar pro meu irmao"
    project: portfólio
    stack: nenhuma
    kind: nao-codigo
    expected: {workflow: custom, mode: direct, agents: []}
    ambiguous: false
    rationale: >
      Não é código: nenhum workflow catalogado se aplica. É exatamente o escape hatch do
      API_SPEC §2 — registrar honestamente em vez de forçar rótulo e envenenar o baseline.

  - id: ts-console-logger
    prompt: "troca todos os console.log por logger no front do agenda"
    project: Agenda Studio
    stack: ts
    kind: mecanico-repetitivo
    expected: {workflow: refactor, mode: subagent, agents: [dev-junior]}
    ambiguous: true
    competes: >
      H3 ("mecânica/repetitiva → dev-junior/haiku") × H5 ("linguagem detectada →
      especialista"). A tabela não declara precedência.
    rationale: >
      Substituição mecânica com critério verificável é o caso canônico do dev-junior — e
      o tiering de custo (ADR-004) é a razão de o roster existir. H3 deve vencer H5.

  - id: react-tela-config
    prompt: "cria a tela de configuracoes do agenda studio"
    project: Agenda Studio
    stack: ts
    kind: feature-ui
    expected: {workflow: feature, mode: subagent, agents: [typescript-pro]}
    ambiguous: false
    rationale: >
      "criar tela" é intent literal de feature na tabela. Uma stack → um subagente + plano.

  - id: qa-fluxo-orcamento
    prompt: "testa se o fluxo de orcamento ta funcionando ponta a ponta"
    project: SmartQuotation
    stack: python+ts
    kind: verificacao-pura
    expected: {workflow: custom, mode: subagent, agents: [qa]}
    ambiguous: false
    rationale: >
      Não há workflow de verificação isolada: `qa` só existe como STEP de feature. O
      pedido é legítimo e frequente → custom + agente qa. Lacuna da tabela, não do pedido.

  - id: review-pr
    prompt: "da uma revisada nesse PR antes de eu mergear"
    project: qualquer
    stack: nenhuma
    kind: review-isolado
    expected: {workflow: custom, mode: subagent, agents: [revisor]}
    ambiguous: false
    rationale: >
      Mesma lacuna do caso anterior: `review` é step, nunca workflow. O revisor é
      read-only por requisito de segurança, então delegar é o caminho certo.

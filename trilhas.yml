# Régua do repo Maestro para o integrador (tropeks/vulcan integrador/trilhas.py). Lida do sha da BASE; mudar este
# arquivo é T3. Por cima dela vale o piso fixo (workflows, actions e este arquivo são T3; manifesto e lint, T2).
# Igual ao padrão, menos o diff-cover: o Maestro é bash puro mais uma CLI em TS exercida por fora

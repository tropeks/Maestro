version: 2   # v2 = bloco `bindings` (S-401). Emenda v1.3 do DATA_MODEL §1.
gate:
  mode: block           # promovido warn→block em 2026-08-29 COM dados: retro de 14d
                        # (133 decisões, override 13% < 20%) + live E2E provando que warn
                        # deixa sessão one-shot editar sem decide. Critério de estabilidade:
                        # tests/e2e/test-live-dispatch.sh PASS em block (EPICS E13).
                        # Reversão = esta linha de volta a warn (aval humano).
  allowlist:            # não-código de verdade: passa sem decision record
    extensions: [.md, .txt]
    paths: [.maestro/, docs/]
  denylist:             # block SEMPRE, mesmo com decisão registrada (ADR-003 v1.1)
    # UNIVERSAIS: perigosos em qualquer projeto. `.claude/` guarda o registro de
    # hooks e o bloco `env` (por onde se desligaria o Maestro) — era o buraco do
    # review P1-3; `.github/workflows/` executa em CI.
    paths: [.claude/, .github/workflows/]
    # AUTOPROTEÇÃO: só valem ancorados na raiz do plugin. Como prefixo relativo
    # bloqueariam o `src/`, `bin/` e `hooks/` de QUALQUER projeto — trabalho
    # legítimo travado, o pior caso do brief §8.
    self_paths: [agents/, bin/, src/, hooks/, config/routing-table.yaml, .claude-plugin/]
workflows:
  # `steps` são nomes de ETAPA, não nomes de comando: quem diz o que roda é o
  # bloco `bindings` abaixo. Antes da v2 os steps de ship/audit se chamavam
  # `gstack-ship`/`gstack-cso` — o nome da ferramenta vazava para dentro do
  # fluxo e trocar de ferramenta obrigaria a reescrever o workflow.
  fix:      {steps: [investigate, implement, review], gate: none}
  # interrogate primeiro (diretriz do Capitão, 2026-08-30): office-hours desafia
  # a premissa da mudança ANTES do plano; o que sobrevive vira a emenda ao doc
  # canônico (E16) que o plano cita. Mudança de produto sem interrogação era o
  # buraco entre "construir certo" e "construir o certo".
  feature:  {steps: [interrogate, plan, implement, review, qa], gate: plan}
  refactor: {steps: [plan, implement, review], gate: plan}
  ship:     {steps: [ship], gate: ship}
  audit:    {steps: [audit], gate: none}
  # escape hatch do API_SPEC §2: tarefa que não cai em nenhum fluxo catalogado.
  # Existe para o roteador poder registrar a decisão honestamente em vez de
  # forçar um rótulo errado — o que envenenaria a métrica de baseline.
  custom:   {steps: [], gate: none}
  # verificação e review isolados: "testa o fluxo" e "revisa o PR" são pedidos que
  # existem sozinhos, sem implementação antes. Sem estes dois caíam em custom e
  # sumiam da métrica (ROUTING_EVAL R7). Reusam bindings já validados.
  verify:     {steps: [qa], gate: none}
  codereview: {steps: [review], gate: none}
# ---------------------------------------------------------------------------
# bindings (S-401) — step → o que EXECUTA o step. Sem isto, `investigate` é uma
# palavra solta e o Claude adivinha; com isto, o step vira comando verificável
# (a AC da S-401 é "cada step referencia comando existente no ambiente", e o
# `maestro doctor` reprova binding que não resolve no ambiente).
#
# Formas: `skill:<nome>` (superpowers ou gstack) · `agent:<nome do roster>`
#         `native:<recurso do Claude Code>` (vocabulário fechado: plan-mode).
# `<nome>` é o nome INSTALADO da skill — o diretório em `~/.claude/skills/` ou
# em `<plugin>/skills/`. Para o gstack isso depende de UMA config dele:
# `gstack-config get skill_prefix`. Com `true` (o modo que este projeto exige, e
# que passou a valer de fato em 2026-08-10) as 52 skills se chamam `gstack-*`;
# com `false` elas se chamam `qa`, `ship`, `cso`. Virar essa chave renomeia as 52
# de uma vez e mata todo binding `skill:` daqui — não é preferência estética, é
# a diferença entre o binding existir e não existir. `maestro doctor` é quem
# mede; rode-o depois de qualquer mexida no pack, e nunca escreva um alvo
# `skill:` sem antes conferir o nome no disco.
# Um step aceita 1 ou 2 alvos. Com 2, a ordem é fixa e significa
#   <método/ferramenta> + <quem executa>:  o skill diz COMO, o agent diz QUEM.
#
# Curadoria (decisão do orquestrador): método vem do superpowers · execução vem
# do roster · ferramenta pesada vem do gstack. O `agent:` só entra no binding
# quando o papel é fixo independentemente de linguagem e tamanho da tarefa;
# quando varia (investigate, plan), quem executa fica a cargo das
# `execution_heuristics` — binding e heurística são eixos diferentes:
# o binding fixa O QUE roda, a heurística escolhe QUEM/qual modelo.
bindings:
  # superpowers puro: é metodologia de depuração (hipótese antes de patch,
  # rastreio até a causa raiz), não ferramenta. gstack-investigate cobre o mesmo
  # terreno e perde pela regra de curadoria. Sem `agent:` de propósito: quem
  # investiga um bug em Go é o golang-pro, e isso é decisão da heurística.
  investigate: skill:systematic-debugging
  # office-hours no modo product-interrogation: pergunta "por que isto, por que
  # agora, o que NÃO construir" antes de qualquer plano de feature. O achado
  # que sobrevive vira emenda ao doc canônico (E16) — interrogação sem registro
  # é opinião que evapora.
  interrogate: skill:gstack-office-hours
  # o gate humano `plan` (S-501) É o plan mode nativo: aprovação de um toque na
  # UI, que é o que torna o gate aprovável do telefone (brief §3.4). Preterido
  # skill:writing-plans — ele produz plano em arquivo para sobreviver a várias
  # sessões; ótimo para épico, caro para "corrige o login". Use-o à mão quando
  # o plano precisar durar mais que a sessão.
  plan:        native:plan-mode
  # execução vem do roster (ADR-004). dev-pleno é o executor por DEFINIÇÃO
  # residual — a description dele é "quando nenhum especialista de linguagem
  # cobre a stack" —, então a heurística "linguagem detectada → especialista"
  # o substitui sem conflito. Não existe skill de "implementar": implementar é
  # papel, não método.
  # ATENÇÃO: H5 SOBREPÕE este binding. dev-pleno é o default RESIDUAL — vale quando
  # nenhum especialista cobre a stack. Sem esta nota, dois juízes independentes
  # leram o binding como ordem e escolheram dev-pleno onde o esperado era o
  # especialista, em 9 de 15 casos (ROUTING_EVAL R9).
  implement:   agent:dev-pleno
  # método do superpowers (como pedir review a um subagente, o que exigir dele)
  # + o papel fixo do roster: revisor é read-only, o que impede o revisor de
  # "consertar" o que revisa. gstack-review foi preterido por ser review de PR
  # pré-landing — esse ponto do ciclo pertence ao step `ship`.
  review:      [skill:requesting-code-review, agent:revisor]
  # ferramenta pesada de verdade (browser headless via daemon do gstack) — o
  # superpowers não tem QA e o roster não tem browser. O agente `qa` entra como
  # executor porque o papel é fixo e ele tem Bash (o daemon é CLI); manter o QA
  # fora do contexto principal também evita que quem implementou valide a si
  # mesmo.
  qa:          [skill:gstack-qa, agent:qa]
  # ferramenta pesada: merge da base, suíte, VERSION, CHANGELOG, PR. Nada disso
  # é método nem papel — é automação, e reimplementar seria absorver o pack
  # (proibido pelo brief §4).
  ship:        skill:gstack-ship
  # auditoria OWASP + STRIDE. Não há agente de segurança no roster (ADR-004) e
  # o superpowers não cobre segurança; é o caso puro de "ferramenta pesada".
  audit:       skill:gstack-cso
# O casamento é SEMÂNTICO, não lexical — o leitor é um LLM, não uma regex. As
# palavras abaixo são âncoras, não a lista fechada. Estão no imperativo porque é
# assim que o pedido chega ("adiciona o campo", não "adicionar campo") — a versão
# no infinitivo custava 3 acertos de workflow na avaliação (ROUTING_EVAL R1).
routes:
  - {intent: "quebrou, deu erro, não funciona, tá bugado, corrige, conserta", workflow: fix}
  - {intent: "adiciona, cria, implementa, nova tela, novo endpoint, quero que tenha", workflow: feature}
  - {intent: "limpa, reorganiza, melhora a estrutura, dívida técnica, tá uma bagunça", workflow: refactor}
  # ship e audit eram workflows inalcançáveis: existiam no catálogo e nenhuma rota
  # levava a eles, então "manda pra produção" caía em custom (ROUTING_EVAL R2).
  - {intent: "sobe, deploya, manda pra produção, lança, publica", workflow: ship}
  - {intent: "segurança, vulnerabilidade, auditoria, tá exposto, vaza", workflow: audit}
  # verify e codereview: "testa o fluxo" e "revisa o PR" são pedidos frequentes que
  # também caíam em custom por não haver fluxo de verificação isolado (R7).
  - {intent: "testa, valida, confere se funciona, roda a suíte", workflow: verify}
  - {intent: "revisa, dá uma olhada no PR, code review", workflow: codereview}

# PRECEDÊNCIA (H1 > H2 > H6 > H5 > H3 > H4). Sem ela, H1×H2 e H3×H5 se contradiziam
# em silêncio e o modelo desempatava por conta própria (ROUTING_EVAL R5, R6).
execution_heuristics:
  - "H1 DELEGUE POR PADRÃO. mode: direct é EXCEÇÃO — só quando delegar não faz sentido: meta-trabalho na própria sessão, tarefa que depende do contexto já acumulado na conversa, ou pergunta/leitura sem edição. Tarefa PEQUENA não é motivo para direct: delegar um bugfix de uma linha a um especialista sonnet custa menos que fazê-lo no contexto principal (ADR-004). Em direct NÃO existe agente — o campo agents não vai no record"
  - "H2 pedido que descreve comportamento novo, ou que cita duas ou mais áreas do sistema → mode: subagent com plano"
  - "H6 mais de uma stack envolvida, ou frentes independentes que não se bloqueiam → mode: multi"
  - "H3 tarefa mecânica, repetitiva e de critério objetivo → dev-junior (haiku). VENCE H5: o tiering de custo é a razão de existir do roster, e mecânico em haiku é mais barato que mecânico em especialista sonnet (ADR-004)"
  - "H5 fora de tarefa mecânica, a linguagem do ALVO (do .maestro.yaml do projeto ou do arquivo citado, não da palavra usada no pedido) escolhe o especialista; H5 sobrepõe o binding de implement, e só se aplica quando mode ≠ direct"
  # H4 e H5 COMPÕEM, não competem. A description do próprio engenheiro diz que ele
  # "entrega plano e trade-offs, não o código final" — rotear um refactor só para ele
  # deixaria a implementação sem dono. Foi a única divergência que os dois juízes
  # cegos apontaram em todas as rodadas de avaliação.
  - "H4 decisão de arquitetura, escolha entre alternativas ou refactor amplo → engenheiro PLANEJA. Ele não escreve o código final: componha com H5 (ou dev-pleno) para implementar — engenheiro + especialista em mode: multi. Decisão ESTRUTURAL CRÍTICA (cross-sistema, migração de dados, concorrência, segurança, cara de reverter) → quem planeja é o arquiteto (opus): tier caro, raro; plano comum segue no engenheiro"
  # Limite conhecido: não há agente de infra/homelab no roster (ADR-004), então
  # tarefa de infra cai em dev-pleno ou custom. Registrado em ROUTING_EVAL R8.
  - "H7 a PROFUNDIDADE do plano é decisão sua e vai no record (--depth): standard por padrão; deep quando a mudança toca contrato ou fronteira de doc canônico (cite doc+seção); day-zero NUNCA automático — só por decide explícito com --profile (prototipo|piloto|produto) quando um projeto está nascendo"
